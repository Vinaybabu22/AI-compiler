{% extends "base.html" %}
{% block content %}
<div class="compiler-container" style="padding: 20px; color: white; background: #0f172a;">
    <h2>Welcome, {{ current_user.username }}</h2>
    <select id="language" style="margin-bottom: 10px; padding: 5px;">
        <option value="python">Python</option>
        <option value="c">C</option>
        <option value="java">Java</option>
    </select>
    
    <textarea id="code" style="width: 100%; height: 300px; background: #1e293b; color: #38bdf8; font-family: monospace; padding: 10px;">{{saved_code}}</textarea>
    
    <div style="margin-top: 10px;">
        <button onclick="runCode()" style="background: #38bdf8; padding: 10px 20px; border: none; cursor: pointer;">Run & Explain</button>
        <button onclick="saveCode()" style="background: #4ade80; padding: 10px 20px; border: none; cursor: pointer; margin-left: 10px;">Save Code</button>
    </div>

    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <div style="flex: 1; background: #1e293b; padding: 15px;">
            <h3>Output</h3>
            <pre id="output" style="white-space: pre-wrap;"></pre>
        </div>
        <div style="flex: 1; background: #1e293b; padding: 15px;">
            <h3>AI ASSISTANT</h3>
            <div id="ai_help"></div>
        </div>
    </div>
</div>

<script>
async function runCode() {
    const code = document.getElementById('code').value;
    const language = document.getElementById('language').value;
    document.getElementById('output').innerText = "Running...";
    
    const res = await fetch('/run', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({code, language})
    });
    const data = await res.json();
    document.getElementById('output').innerText = data.output;
    document.getElementById('ai_help').innerText = data.ai_help;
}

async function saveCode() {
    const code = document.getElementById('code').value;
    const language = document.getElementById('language').value;
    const filename = prompt("Enter filename:", "project_code");
    
    if (filename) {
        const res = await fetch('/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code, language, filename})
        });
        const data = await res.json();
        alert(data.message);
    }
}
</script>
{% endblock %}
