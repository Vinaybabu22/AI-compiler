<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- ═══════════ NAVBAR ═══════════ -->
<nav class="navbar">
    <div class="nav-left">
        <!-- Logo mark -->
        <a href="/" class="nav-logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#7c3aed" stroke-width="1.8" fill="none"/>
                <path d="M2 17l10 5 10-5" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
                <path d="M2 12l10 5 10-5" stroke="#7c3aed" stroke-width="1.8" fill="none" opacity="0.5"/>
            </svg>
            <span class="nav-logo-text">AI Compiler</span>
        </a>
    </div>

    <div class="nav-right">
        {% if current_user.is_authenticated %}
            <!-- Greeting -->
            <span class="nav-greeting">Hey, <span class="nav-greeting-name">{{ current_user.username }}</span> 👋</span>

            <!-- Avatar dropdown -->
            <div class="avatar-wrap" id="avatarWrap">
                <div class="avatar" id="avatarBtn">
                    {{ current_user.username[0] | upper }}
                </div>
                <div class="avatar-menu" id="avatarMenu">
                    <div class="avatar-menu-header">
                        <div class="avatar-menu-avatar">{{ current_user.username[0] | upper }}</div>
                        <div>
                            <div class="avatar-menu-name">{{ current_user.username }}</div>
                            <div class="avatar-menu-sub">Developer</div>
                        </div>
                    </div>
                    <div class="avatar-menu-divider"></div>
                    <a href="{{ url_for('auth.profile') }}" class="avatar-menu-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        Profile
                    </a>
                    <a href="{{ url_for('compiler.history') }}" class="avatar-menu-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        Saved Code
                    </a>
                    <div class="avatar-menu-divider"></div>
                    <a href="{{ url_for('auth.logout') }}" class="avatar-menu-item danger">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/></svg>
                        Logout
                    </a>
                </div>
            </div>
        {% else %}
            <a href="{{ url_for('auth.login') }}" class="nav-link">Login</a>
            <a href="{{ url_for('auth.register') }}" class="nav-btn">Sign Up</a>
        {% endif %}
    </div>
</nav>

{% block content %}{% endblock %}

<script>
    // Avatar dropdown toggle
    const btn  = document.getElementById('avatarBtn');
    const menu = document.getElementById('avatarMenu');
    if (btn && menu) {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            menu.classList.toggle('open');
        });
        document.addEventListener('click', () => menu.classList.remove('open'));
    }
</script>
</body>
</html>
