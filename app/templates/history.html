{% extends "base.html" %}
{% block content %}
<div class="history-shell">
<div class="history-container">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <div class="history-title">Saved Code</div>
        <a href="{{ url_for('compiler.index') }}" style="font-size:12px;color:var(--text-3);text-decoration:none;">
            ← Back to Editor
        </a>
    </div>

    <div class="history-grid">
        {% for code in codes %}
        <div class="history-card">
            <div>
                <div class="history-card-name">{{ code.filename }}</div>
                <div class="history-card-meta">{{ code.language }} · {{ code.timestamp.strftime('%b %d, %Y  %H:%M') }}</div>
            </div>
            <a href="/?load={{ code.id }}" class="history-card-load">Open in Editor</a>
        </div>
        {% else %}
        <div style="text-align:center;padding:60px 0;color:var(--text-3);font-size:13px;">
            No saved code yet. Write something and click <strong>Save</strong>.
        </div>
        {% endfor %}
    </div>

</div>
</div>
{% endblock %}
