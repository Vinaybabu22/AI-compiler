{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
<div class="auth-box">
    <h2>Join <span>AI Compiler</span></h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div class="flash-msg {{ cat }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input class="auth-input" type="text"     name="username" placeholder="Choose a username" required autofocus>
        <input class="auth-input" type="password" name="password" placeholder="Create a password" required>
        <button type="submit" class="auth-btn">Create Account</button>
    </form>

    <div class="auth-footer">
        Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
</div>
</div>
{% endblock %}
